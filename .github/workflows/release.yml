name: Release
# Actions → Release → Run workflow (on main). Checks the commit, moves CHANGELOG.md's
# "## Unreleased" section to the new version, commits and tags it, then publishes the GitHub
# release with that section as its notes, tells Packagist (janalis/viz, from the tag) and
# rebuilds the documentation so its changelog and version are current.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z, or patch | minor | major (a bump of the latest tag)"
        required: true
        default: minor
      dry_run:
        description: "Prepare everything, publish nothing"
        type: boolean
        default: false

concurrency: release

permissions:
  contents: write

env:
  PHP_EXTENSIONS: mbstring, gd, zlib, intl

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          ini-values: zend.assertions=1
          extensions: ${{ env.PHP_EXTENSIONS }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz poppler-utils fonts-dejavu-core
      - run: composer install --no-interaction --no-progress
      # CI's coverage job already graded this commit; these are the gates a release must pass.
      - run: make validate fmt-check lint analyze test
      - id: prepare
        env:
          BUMP: ${{ inputs.version }}
        run: php tools/release-prepare.php --bump "$BUMP" --notes "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"
      - run: git diff
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
      - if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

  # A job of its own, so a failed publish can be retried ("Re-run failed jobs") without cutting
  # the release again.
  publish:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
      # Packagist's GitHub hook already picks up the tag; this makes it immediate.
      - env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "Packagist secrets not set; relying on the GitHub hook"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $PACKAGIST_USERNAME:$PACKAGIST_TOKEN" \
            -d "{\"repository\":{\"url\":\"https://github.com/$GITHUB_REPOSITORY\"}}" \
            https://packagist.org/api/update-package

  docs:
    needs: [prepare, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
