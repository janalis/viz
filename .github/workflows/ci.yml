name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # intl is optional: the grapheme calls ride symfony/polyfill-intl-grapheme, so
  # the matrix grades the native path and the polyfill alike.
  PHP_EXTENSIONS: mbstring, gd, zlib

jobs:
  static:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: ${{ env.PHP_EXTENSIONS }}, intl
      - run: composer install --no-interaction --no-progress
      - run: make validate fmt-check lint analyze audit

  tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intl
            extensions: intl
          - name: polyfill (no intl)
            extensions: ':intl'
    name: tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          # php.ini-production compiles assert() out; the invariants are meant to run.
          ini-values: zend.assertions=1
          extensions: ${{ env.PHP_EXTENSIONS }}, ${{ matrix.extensions }}
      # dot is exercised for real where it is installed; plantuml and mmdc are
      # stood in for by scripted fakes, so no JVM or browser is needed here.
      # DejaVu is the host fallback the PNG and PDF backends reach for glyphs
      # the bundled face lacks.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz poppler-utils fonts-dejavu-core
      - run: composer install --no-interaction --no-progress
      - run: make test

  coverage:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          ini-values: zend.assertions=1
          extensions: ${{ env.PHP_EXTENSIONS }}, intl
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz poppler-utils fonts-dejavu-core
      - run: composer install --no-interaction --no-progress
      - run: make coverage
